name: Windows upgrade baseline preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      OPENSQUILLA_TESTING: "true"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare isolated runtime and dependencies
        run: |
          "OPENSQUILLA_STATE_DIR=$env:RUNNER_TEMP/preflight-state" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSQUILLA_LOG_DIR=$env:RUNNER_TEMP/preflight-logs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          uv sync --locked --extra dev --extra recommended --extra mcp
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - name: Verify source and interpreter
        run: |
          (Get-Location).Path
          git rev-parse --show-toplevel HEAD
          uv run python -c "import sys,opensquilla;print(sys.executable);print(opensquilla.__file__)"
          node --version
          $PSVersionTable.PSVersion.ToString()
      - name: Recheck all three previously failing probes
        run: |
          uv run pytest -q --tb=short --durations=10 `
            'tests/test_ci/test_upgrade_baselines.py::test_packaged_recovery_preserves_original_failure_after_cleanup[False-False]' `
            tests/test_ci/test_upgrade_baselines.py::test_windows_nsis_known_folder_is_independent_of_localappdata_environment `
            tests/test_ci/test_upgrade_baselines.py::test_rehearsal_driver_rejects_mislabeled_official_baseline
          if ($LASTEXITCODE -ne 0) { throw 'Previously failing probe failed' }
      - name: Run complete affected files with the production phase split
        run: |
          uv run pytest -q --tb=short --durations=10 -n 4 --dist=loadfile -m 'not ci_serial' tests/test_ci/test_upgrade_baselines.py tests/test_ci/test_windows_test_shards.py tests/test_tools/test_web_fetch_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'Parallel file preflight failed' }
          uv run pytest -q --tb=short --durations=10 -m ci_serial tests/test_ci/test_upgrade_baselines.py tests/test_ci/test_windows_test_shards.py tests/test_tools/test_web_fetch_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'Serial file preflight failed' }
