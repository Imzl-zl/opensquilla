name: Issue 1441 isolated NSIS reproduction
on:
  workflow_dispatch:
    inputs:
      mode:
        description: build or reproduce
        type: choice
        options: [build, reproduce]
        default: build
      candidate:
        description: main audit artifact or historical official 0.5.4
        type: choice
        options: [main, official]
        default: main
      artifact_run_id:
        description: Build run holding issue-1441-main-installer
        required: false
        default: ''
      scenario:
        description: Run all scenarios or one targeted diagnostic case
        type: choice
        options: [all, baseline, faults, readlock, longpath]
        default: all
      baseline:
        description: Filter the official starting version for main candidate cases
        type: choice
        options: [all, '0.5.3', '0.5.4']
        default: all
permissions:
  contents: read
  actions: read
concurrency:
  group: issue-1441-${{ github.run_id }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 30cad412219b13bfc399b4b102944c7abf5ad325
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  build:
    if: inputs.mode == 'build'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            source/opensquilla-webui/package-lock.json
            source/desktop/electron/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: source
      - name: Hydrate router assets
        run: |
          git lfs pull --include='src/opensquilla/squilla_router/models/**'
          if ($LASTEXITCODE -ne 0) { throw 'Router LFS fetch failed' }
      - name: Build and verify complete WebUI
        working-directory: source/opensquilla-webui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'WebUI npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'WebUI build failed' }
          npm run verify:release-dist
          if ($LASTEXITCODE -ne 0) { throw 'WebUI verification failed' }
          node scripts/stage-dist.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WebUI staging failed' }
      - name: Build complete current-main NSIS package without signing
        working-directory: source/desktop/electron
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Electron npm ci failed' }
          node ../../.github/scripts/verify-sandbox-package.mjs --source
          if ($LASTEXITCODE -ne 0) { throw 'Runtime catalog verification failed' }
          npm run build:gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway build failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
          npm run verify:prepared
          if ($LASTEXITCODE -ne 0) { throw 'Prepared package verification failed' }
          node -e "const b=require('electron-builder'); b.build({targets:b.Platform.WINDOWS.createTarget('nsis'),publish:'never',config:{win:{signExecutable:false},forceCodeSigning:false}}).catch(e=>{console.error(e);process.exitCode=1})"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          npm run verify:package
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Record immutable candidate identities
        run: |
          $root = Join-Path $PWD 'dist/desktop-electron'
          $installers = @(Get-ChildItem -LiteralPath $root -Filter 'OpenSquilla-*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $exe = Join-Path $root 'win-unpacked/OpenSquilla.exe'
          $asar = Join-Path $root 'win-unpacked/resources/app.asar'
          $manifest = [ordered]@{
            sourceSha = (git rev-parse HEAD).Trim()
            auditRunId = $env:GITHUB_RUN_ID
            signing = 'unsigned diagnosis only'
            installerName = $installers[0].Name
            installerSha256 = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            executableSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            asarSha256 = (Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash.ToLowerInvariant()
            version = ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe)).ProductVersion
          }
          if ($manifest.sourceSha -ne $env:SOURCE_SHA) { throw 'Unexpected source SHA' }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'audit-candidate.json') -Encoding utf8
          $manifest | ConvertTo-Json
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1441-main-installer
          path: |
            source/dist/desktop-electron/OpenSquilla-*-win-x64.exe
            source/dist/desktop-electron/audit-candidate.json
          if-no-files-found: error
          retention-days: 14
  reproduce:
    if: inputs.mode == 'reproduce'
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        baseline: ${{ fromJSON(inputs.candidate == 'official' && '["0.5.3"]' || inputs.baseline == '0.5.3' && '["0.5.3"]' || inputs.baseline == '0.5.4' && '["0.5.4"]' || '["0.5.3","0.5.4"]') }}
        scenario: ${{ fromJSON(inputs.scenario == 'baseline' && '["baseline"]' || inputs.scenario == 'faults' && '["readlock","longpath"]' || inputs.scenario == 'readlock' && '["readlock"]' || inputs.scenario == 'longpath' && '["longpath"]' || '["baseline","readlock","longpath"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official old installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path old,candidate | Out-Null
          gh release download 'v${{ matrix.baseline }}' --repo TokenRhythm/opensquilla --pattern 'OpenSquilla-${{ matrix.baseline }}-win-x64.exe' --dir old
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          if ('${{ inputs.candidate }}' -eq 'official') {
            gh release download v0.5.4 --repo TokenRhythm/opensquilla --pattern 'OpenSquilla-0.5.4-win-x64.exe' --dir candidate
            if ($LASTEXITCODE -ne 0) { throw 'Historical candidate download failed' }
          }
      - uses: actions/download-artifact@v4
        if: inputs.candidate == 'main'
        with:
          name: issue-1441-main-installer
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Reproduce isolated full NSIS upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = @(Get-ChildItem old -Filter '*.exe' -File)
          $candidate = @(Get-ChildItem candidate -Filter '*.exe' -File)
          if ($old.Count -ne 1 -or $candidate.Count -ne 1) { throw 'Unexpected installer count' }
          $evidence = Join-Path $env:RUNNER_TEMP 'issue-1441-evidence'
          $arguments = @('.github/scripts/verify-nsis-upgrade-failure.py',
            '--baseline-installer', $old[0].FullName, '--candidate-installer', $candidate[0].FullName,
            '--baseline-version', '${{ matrix.baseline }}', '--candidate-version', '0.5.4',
            '--case', '${{ matrix.scenario }}', '--evidence-root', $evidence)
          if ('${{ inputs.candidate }}' -eq 'main') {
            $manifest = Get-Content candidate/audit-candidate.json -Raw | ConvertFrom-Json
            if ($manifest.sourceSha -ne $env:SOURCE_SHA) { throw 'Candidate source mismatch' }
            if ((Get-FileHash -LiteralPath $candidate[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.installerSha256) { throw 'Candidate hash mismatch' }
            $arguments += @('--candidate-asar-sha256', $manifest.asarSha256, '--candidate-executable-sha256', $manifest.executableSha256)
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Full NSIS reproduction did not satisfy its assertions' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1441-${{ inputs.candidate }}-${{ matrix.baseline }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/issue-1441-evidence/
            candidate/audit-candidate.json
          if-no-files-found: warn
          retention-days: 14
