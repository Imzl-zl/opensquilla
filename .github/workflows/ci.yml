# Temporary staging overlay only. Never merge this workflow into the feature branch.
name: CI - temporary Plan Goal slice validation
'on':
  workflow_dispatch:
    inputs:
      slice_refs:
        description: JSON array of exactly eight full commit SHAs, ordered slice 0 through 7
        required: true
        type: string
      base_sha:
        description: Exact parent commit of slice 0
        required: true
        default: 8c093407372fce234739b882831de4c93261237b
        type: string
permissions:
  contents: read
concurrency:
  group: temporary-plan-goal-slices-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  OPENSQUILLA_TESTING: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  OPENSQUILLA_TURN_CALL_LOG: '0'
jobs:
  plan:
    name: Validate the eight ordered immutable refs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - name: Validate input and create the exact eight-checkout matrix
      id: plan
      env:
        SLICE_REFS_JSON: ${{ inputs.slice_refs }}
        BASE_SHA: ${{ inputs.base_sha }}
        SLICE_CONFIG_JSON: '{"0":{"pytest_files":["tests/test_migrations/test_v045_goal_runtime_accounting.py","tests/test_live_plan_goal_runtime.py","tests/test_live_plan_recovery_cases.py","tests/test_live_plan_stop_child.py","tests/test_gateway_timing.py","tests/functional/test_gateway_silent_reply_process_e2e.py","tests/integration/cli/tui_real_terminal/test_driver_capabilities.py","tests/test_ci/test_workflows.py","tests/test_ci/test_plan_ci.py"],"regression_files":["tests/functional/test_gateway_silent_reply_process_e2e.py"],"unit_files":[],"browser_spec":"","ui":false},"1":{"pytest_files":["tests/test_session/test_plan_presentation.py","tests/test_gateway/test_plan_rpc.py","tests/test_gateway/test_session_read_adapter.py","tests/contracts/test_gateway_contract_runner.py","tests/contracts/test_gateway_validator_profiles.py","tests/contracts/test_r7_contract_freeze.py","tests/test_ci/test_rpc_architecture_contracts.py"],"regression_files":[],"unit_files":["src/composables/chat/useChatPlans.test.ts","src/composables/chat/useChatGoals.test.ts","src/utils/chat/planImplementationRecovery.test.ts","src/utils/chat/goalSetRecovery.test.ts","src/components/chat/PlanCard.test.ts","src/components/chat/PlanRunRibbon.test.ts","src/adapters/gateway/planCenterV4.test.ts","src/adapters/gateway/sessionReadPortV4.test.ts"],"browser_spec":"plan-presentation.spec.ts","ui":true},"2":{"pytest_files":["tests/test_gateway/test_background_completion.py","tests/test_gateway/test_plan_public_runtime.py","tests/test_gateway/test_plan_rpc.py","tests/test_gateway/test_plan_cancel_tree.py","tests/test_gateway/test_task_progress_projection.py","tests/test_session/test_task_progress.py","tests/test_engine/test_plan_run_reconciliation.py","tests/test_tools/test_plan_access.py","tests/test_tools/test_tool_upgrade_compatibility.py","tests/test_engine/turn_runner/test_stage_test_boundaries.py","tests/test_engine/turn_runner/test_prompt_assembler_stage_unit.py","tests/test_engine/turn_runner/test_prompt_assembler_stage_snapshot.py"],"regression_files":["tests/test_gateway/test_plan_cancel_tree.py","tests/test_gateway/test_background_completion.py"],"unit_files":["src/composables/chat/useChatTaskProgress.test.ts","src/composables/chat/useChatRpcEventHandlers.test.ts","src/adapters/gateway/conversationEventsV4.test.ts"],"browser_spec":"task-progress.spec.ts","ui":true},"3":{"pytest_files":["tests/test_gateway/test_task_runtime_wait_slots.py","tests/test_gateway/test_goal_child_wait.py","tests/test_gateway/test_background_completion.py","tests/test_tools/test_tool_upgrade_compatibility.py"],"regression_files":[],"unit_files":[],"browser_spec":"","ui":false},"4":{"pytest_files":["tests/test_gateway/test_usage_ledger_runtime.py","tests/test_session/test_goal_storage.py","tests/test_gateway/test_goal_usage_capacity_integration.py","tests/test_gateway/test_goal_rpc.py","tests/test_tools/test_tool_upgrade_compatibility.py"],"regression_files":[],"unit_files":[],"browser_spec":"","ui":false},"5":{"pytest_files":["tests/test_engine/test_runtime_artifacts.py","tests/test_engine/test_tokenjuice_tool_result_projection.py","tests/test_engine/test_goal_context_prompt.py","tests/test_gateway/test_goal_rpc.py","tests/test_gateway/test_desktop_browser.py"],"regression_files":[],"unit_files":["src/components/chat/ChatComposerPlanMode.test.ts","src/components/chat/ChatComposerAddMenu.test.ts"],"browser_spec":"","ui":true},"6":{"pytest_files":["tests/test_gateway/test_goal_rpc.py","tests/test_gateway/test_goal_child_wait.py","tests/test_gateway/test_goal_connection_authority.py","tests/test_gateway/test_named_tokens.py","tests/test_gateway/test_router_boot.py","tests/test_gateway/test_websocket_close_coordination.py","tests/test_gateway/test_channel_turn_ingress.py","tests/test_gateway/test_goal_registry_cleanup.py","tests/test_live_goal_disconnect_gate.py","tests/test_live_goal_disconnect_boundary.py"],"regression_files":["tests/test_gateway/test_goal_rpc.py"],"unit_files":["src/components/chat/GoalRibbon.test.ts","src/composables/chat/useChatGoals.test.ts","src/views/ChatView.goal-outcome.test.ts"],"browser_spec":"goal-mode.spec.ts","ui":true},"7":{"pytest_files":["tests/test_ci/test_architecture_import_contracts.py","tests/test_persistence/test_migration_compatibility.py","tests/test_migration/test_opensquilla_home_migration.py","tests/test_recovery/test_restore.py","tests/test_recovery/test_historical_upgrades.py","tests/test_packaging/test_webui_build_contract.py","tests/test_ci/test_workflows.py","tests/test_ci/test_plan_ci.py"],"regression_files":[],"unit_files":[],"browser_spec":"","ui":true}}'
      run: |
        python - <<'PYCODE'
        import json
        import os
        import re
        from pathlib import Path

        refs = json.loads(os.environ['SLICE_REFS_JSON'])
        base = os.environ['BASE_SHA']
        assert re.fullmatch(r'[0-9a-f]{40}', base), 'base_sha must be a full lowercase commit SHA'
        assert isinstance(refs, list) and len(refs) == 8, 'Exactly eight ordered slice commit SHAs are required'
        assert all(isinstance(ref, str) and re.fullmatch(r'[0-9a-f]{40}', ref) for ref in refs)
        assert len(set(refs)) == 8 and base not in refs, 'Use eight distinct slice commits after the base'
        config = json.loads(os.environ['SLICE_CONFIG_JSON'])
        rows = []
        for index, ref in enumerate(refs):
            rows.append({'slice': index, 'ref': ref, 'parent_ref': base if index == 0 else refs[index-1], **config[str(index)]})
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
            out.write('matrix=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
            out.write('## Ordered slice validation\n\n')
            out.write('Each slice is a fresh ordinary checkout. No test result is reused from the final candidate.\n\n')
            for row in rows:
                out.write(f"- Slice {row['slice']}: `{row['ref']}` after `{row['parent_ref']}`\n")
        PYCODE
  slice:
    name: Slice ${{ matrix.slice }} - ${{ matrix.ref }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      SLICE: ${{ matrix.slice }}
      EXPECTED_SHA: ${{ matrix.ref }}
      EXPECTED_PARENT_SHA: ${{ matrix.parent_ref }}
      PYTHONPATH: ${{ github.workspace }}/src
      NODE_PATH: ${{ github.workspace }}/opensquilla-webui/node_modules
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PREFLIGHT_FILES_JSON: '["tests/test_sandbox/test_trusted_sandbox_execution.py", "tests/test_tools/test_approval_unification.py",
        "tests/test_live_multi_provider_matrix.py", "tests/test_live_provider_profile_smoke.py", "tests/test_live_plan_goal_runtime.py"]'
      PYTEST_FILES_JSON: ${{ toJSON(matrix.pytest_files) }}
      REGRESSION_FILES_JSON: ${{ toJSON(matrix.regression_files) }}
      UNIT_FILES_JSON: ${{ toJSON(matrix.unit_files) }}
      BROWSER_SPEC: ${{ matrix.browser_spec }}
    steps:
    - name: Check out the exact slice source with LFS
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}
        fetch-depth: 2
        lfs: true
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Initialize evidence and verify ordinary checkout identity
      run: |
        export EVIDENCE_DIR="$RUNNER_TEMP/slice-evidence-$SLICE"
        export OPENSQUILLA_STATE_DIR="$RUNNER_TEMP/slice-runtime-$SLICE/state"
        export OPENSQUILLA_LOG_DIR="$RUNNER_TEMP/slice-runtime-$SLICE/logs"
        export OPENSQUILLA_USER_STATE_DIR="$RUNNER_TEMP/slice-runtime-$SLICE/user-state"
        for name in EVIDENCE_DIR OPENSQUILLA_STATE_DIR OPENSQUILLA_LOG_DIR OPENSQUILLA_USER_STATE_DIR; do
          printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
        done
        mkdir -p "$EVIDENCE_DIR" "$OPENSQUILLA_STATE_DIR" "$OPENSQUILLA_LOG_DIR" "$OPENSQUILLA_USER_STATE_DIR"
        cat > "$RUNNER_TEMP/slice-checked-command.bash" <<'BASH'
        run_checked() {
          local phase="$1"
          shift
          local result=0
          printf '%q ' "$@" > "$EVIDENCE_DIR/$phase.command.txt"
          printf '\n' >> "$EVIDENCE_DIR/$phase.command.txt"
          set +e
          "$@" 2>&1 | tee "$EVIDENCE_DIR/$phase.log"
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > "$EVIDENCE_DIR/$phase.exit-code.txt"
          return "$result"
        }
        BASH
        printf 'BASH_ENV=%s\n' "$RUNNER_TEMP/slice-checked-command.bash" >> "$GITHUB_ENV"
        python - <<'PYCODE'
        import json
        import os
        import subprocess
        import tempfile
        from pathlib import Path
        root = Path.cwd().resolve()
        git_root = Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()).resolve()
        assert root == git_root == Path(os.environ['GITHUB_WORKSPACE']).resolve()
        assert '.codex' not in root.parts
        assert not root.is_relative_to(Path(tempfile.gettempdir()).resolve()), 'Source checkout must be outside system temp'
        head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
        assert head == os.environ['EXPECTED_SHA'], (head, os.environ['EXPECTED_SHA'])
        assert parent == os.environ['EXPECTED_PARENT_SHA'], 'Slice commits must form the specified exact chain'
        assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip()
        record = {'slice': int(os.environ['SLICE']), 'sha': head, 'parent_sha': parent, 'cwd': str(root), 'git_root': str(git_root)}
        Path(os.environ['EVIDENCE_DIR'], 'checkout.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record, sort_keys=True))
        PYCODE
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.12.15
        enable-cache: true
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version-file: opensquilla-webui/.node-version
        cache: npm
        cache-dependency-path: opensquilla-webui/package-lock.json
    - name: Install frozen Python dependencies
      run: |
        run_checked python-dependencies uv sync --extra dev --extra recommended --extra mcp --frozen
    - name: Verify exact Python package and dependency inputs
      run: |
        run_checked imports uv run --no-sync python - <<'PYCODE'
        import hashlib
        import json
        import os
        import platform
        import sys
        from pathlib import Path
        import opensquilla
        root = Path.cwd().resolve()
        expected = root / 'src/opensquilla/__init__.py'
        actual = Path(opensquilla.__file__).resolve()
        assert actual == expected, f'Wrong imported package: {actual}; expected {expected}'
        assert sys.version_info[:2] == (3, 12)
        assert Path(sys.prefix).resolve() == root / '.venv', 'Use this slice checkout virtual environment'
        record = json.loads(Path(os.environ['EVIDENCE_DIR'], 'checkout.json').read_text())
        record.update({'python_executable': sys.executable, 'python_version': platform.python_version(), 'package_file': str(actual),
                       'uv_lock_sha256': hashlib.sha256((root / 'uv.lock').read_bytes()).hexdigest(),
                       'pyproject_sha256': hashlib.sha256((root / 'pyproject.toml').read_bytes()).hexdigest()})
        Path(os.environ['EVIDENCE_DIR'], 'source-identity.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record, sort_keys=True))
        PYCODE
    - name: Check every selected complete test file exists at this slice
      run: |
        python - <<'PYCODE'
        import json
        import os
        from pathlib import Path
        root = Path.cwd()
        preflight = json.loads(os.environ['PREFLIGHT_FILES_JSON'])
        selected = json.loads(os.environ['PYTEST_FILES_JSON'])
        regression = json.loads(os.environ['REGRESSION_FILES_JSON'])
        units = json.loads(os.environ['UNIT_FILES_JSON'])
        browser = os.environ['BROWSER_SPEC']
        paths = [*preflight, *regression, *selected, *('opensquilla-webui/' + item for item in units)]
        if browser:
            paths.append('opensquilla-webui/e2e/' + browser)
        missing = [path for path in paths if not (root / path).is_file()]
        assert not missing, f'Slice is missing required validation files: {missing}'
        for name, values in [('preflight', preflight), ('regression', regression), ('pytest', selected), ('unit', units)]:
            Path(os.environ['EVIDENCE_DIR'], name + '-files.txt').write_text('\n'.join(values) + '\n')
        Path(os.environ['EVIDENCE_DIR'], 'selection.json').write_text(json.dumps({'preflight': preflight, 'regression': regression, 'pytest': selected, 'units': units, 'browser': browser}, indent=2) + '\n')
        PYCODE
    - name: Install frontend dependencies
      if: ${{ matrix.ui }}
      working-directory: opensquilla-webui
      run: |
        run_checked npm-dependencies npm ci
    - name: Build and stage WebUI for this exact slice
      if: ${{ matrix.ui }}
      working-directory: opensquilla-webui
      run: |
        run_checked webui-build npm run build
        run_checked webui-staged node scripts/stage-dist.mjs --check
    - name: Run environment preflight before slice validation
      run: |
        mapfile -t files < "$EVIDENCE_DIR/preflight-files.txt"
        run_checked environment-preflight uv run --no-sync pytest "${files[@]}" -vv --tb=short -o faulthandler_timeout=60 --junitxml="$EVIDENCE_DIR/environment-preflight.xml"
    - name: Preflight previous failures in this slice before its complete test set
      if: ${{ matrix.slice == 0 || matrix.slice == 2 || matrix.slice == 6 }}
      run: |
        mapfile -t files < "$EVIDENCE_DIR/regression-files.txt"
        run_checked regression-preflight uv run --no-sync pytest "${files[@]}" -vv --tb=short -o faulthandler_timeout=60 --junitxml="$EVIDENCE_DIR/regression-preflight.xml"
    - name: Run the slice complete Python test files
      run: |
        mapfile -t files < "$EVIDENCE_DIR/pytest-files.txt"
        run_checked slice-python uv run --no-sync pytest "${files[@]}" -vv --tb=short -o faulthandler_timeout=60 --junitxml="$EVIDENCE_DIR/slice-python.xml"
    - name: Run affected WebUI unit files
      if: ${{ matrix.ui && matrix.slice != 7 }}
      working-directory: opensquilla-webui
      run: |
        mapfile -t files < "$EVIDENCE_DIR/unit-files.txt"
        run_checked webui-unit npm run test:unit -- "${files[@]}" --reporter=default --reporter=junit --outputFile.junit="$EVIDENCE_DIR/webui-unit.xml"
    - name: Verify generated contracts deterministically
      if: ${{ matrix.slice == 1 }}
      env:
        NODE_PATH: ${{ github.workspace }}/opensquilla-webui/node_modules
      run: |
        run_checked contract-generation uv run --no-sync python scripts/contracts/generate_gateway_contracts.py --check-determinism --jobs 4
    - name: Lint the source CI workflow
      if: ${{ matrix.slice == 0 || matrix.slice == 7 }}
      run: |
        run_checked workflow-lint go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false .github/workflows/ci.yml
    - name: Install real Linux guest sandbox for browser checks
      if: ${{ matrix.browser_spec != '' }}
      run: |
        run_checked sandbox-apt-update sudo apt-get update
        run_checked sandbox-install sudo apt-get install --yes bubblewrap
    - name: Verify guest sandbox without changing host security policy
      if: ${{ matrix.browser_spec != '' }}
      run: |
        run_checked sandbox-version bwrap --version
        run_checked sandbox-namespace bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc /bin/true
        run_checked sandbox-readiness uv run --no-sync python - <<'PYCODE'
        import json
        from dataclasses import asdict
        from opensquilla.sandbox.backend.linux_readiness import probe_bwrap
        probe = probe_bwrap()
        print(json.dumps(asdict(probe), sort_keys=True))
        if not probe.available or not probe.supports_perms:
            raise SystemExit('Linux guest sandbox preflight failed: ' + probe.message)
        PYCODE
    - name: Install Chromium for production Gateway browser tests
      if: ${{ matrix.browser_spec != '' }}
      working-directory: opensquilla-webui
      run: |
        run_checked chromium-install npx playwright install --with-deps chromium
    - name: Run the complete selected browser spec against production dist
      if: ${{ matrix.browser_spec != '' }}
      working-directory: opensquilla-webui
      env:
        PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ env.EVIDENCE_DIR }}/browser.xml
        OPENSQUILLA_WEBUI_BASE_URL: http://127.0.0.1:18791
        OPENSQUILLA_PLAYWRIGHT_MANAGE_WEBUI: gateway
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      run: |
        run_checked browser npm run test:e2e -- "$BROWSER_SPEC" --project=chromium --workers=1 --retries=0 --reporter=list,junit --output="$EVIDENCE_DIR/browser-results"
    - name: Set up the existing OpenTUI Bun version
      if: ${{ matrix.slice == 7 }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: src/opensquilla/cli/tui/opentui/package/.bun-version
    - name: Install terminal capabilities
      if: ${{ matrix.slice == 7 }}
      run: |
        run_checked terminal-apt-update sudo apt-get update
        run_checked terminal-install sudo apt-get install --yes tmux
    - name: Install existing OpenTUI host dependencies
      if: ${{ matrix.slice == 7 }}
      working-directory: src/opensquilla/cli/tui/opentui/package
      run: |
        run_checked opentui-dependencies bun install --frozen-lockfile
    - name: Run real terminal completion and resize regression
      if: ${{ matrix.slice == 7 }}
      run: |
        run_checked real-terminal uv run --no-sync pytest tests/integration/cli/tui_real_terminal/test_completion_menu.py -m tui_real_terminal --tui-driver=tmux --tui-require-capabilities --tui-artifact-root="$EVIDENCE_DIR/terminal" -vv --tb=short -o faulthandler_timeout=60 --junitxml="$EVIDENCE_DIR/real-terminal.xml"
    - name: Build the standard wheel using current build configuration
      if: ${{ matrix.slice == 7 }}
      run: |
        run_checked wheel-build uv build --wheel --out-dir "$RUNNER_TEMP/slice-7-wheel"
    - name: Verify wheel registry, WebUI bytes and isolated migration import
      if: ${{ matrix.slice == 7 }}
      run: |
        run_checked wheel-content uv run --no-sync python - <<'PYCODE'
        import hashlib
        import json
        import os
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        from scripts.verify_webui_artifact import verify_wheel
        root = Path.cwd().resolve()
        wheel_dir = Path(os.environ['RUNNER_TEMP']) / 'slice-7-wheel'
        wheels = list(wheel_dir.glob('*.whl'))
        assert len(wheels) == 1, wheels
        wheel = wheels[0]
        dist = root / 'opensquilla-webui/dist'
        verify_wheel(dist, wheel, webui_root=root / 'opensquilla-webui', forbid_personal_bgm=True)
        with zipfile.ZipFile(wheel) as archive:
            registry_name = 'opensquilla/_migrations/registry.json'
            assert archive.namelist().count(registry_name) == 1
            registry = json.loads(archive.read(registry_name))['migrations']
            source_files = sorted((root / 'migrations').glob('V*.py'))
            assert len(source_files) == 47 and set(registry) == {path.stem for path in source_files}
            for source in source_files:
                content = source.read_bytes()
                assert archive.read('opensquilla/_migrations/' + source.name) == content
                assert registry[source.stem]['source_sha256'] == hashlib.sha256(content).hexdigest()
                assert registry[source.stem]['ledger_hash'] == hashlib.sha256(source.stem.encode()).hexdigest()
            assert any(name.startswith('V045__') for name in registry)
            assert any(name.startswith('V046__') for name in registry)
            assert 'opensquilla/engine/collaboration_prompt.py' in archive.namelist()
            assert 'opensquilla/migration_compatibility.py' in archive.namelist()
            unpacked = Path(os.environ['RUNNER_TEMP']) / 'slice-7-unpacked'
            archive.extractall(unpacked)
        program = "import json, os\nfrom pathlib import Path\nimport opensquilla\nfrom opensquilla.persistence.migrator import apply_pending, resolve_migrations_dir\nexpected = Path(os.environ['UNPACKED_WHEEL']).resolve()\nassert Path(opensquilla.__file__).resolve() == expected / 'opensquilla/__init__.py'\nmigrations = resolve_migrations_dir()\nassert migrations.resolve() == expected / 'opensquilla/_migrations'\ndb_path = Path(os.environ['WHEEL_PROBE_DB'])\nfirst = apply_pending('sqlite:///' + str(db_path), migrations)\nsecond = apply_pending('sqlite:///' + str(db_path), migrations)\nassert len(first) == 47 and second == [], (first, second)\nprint(json.dumps({'first_migrations': len(first), 'second_migrations': len(second)}))\n"
        child_env = dict(os.environ, PYTHONPATH=str(unpacked), UNPACKED_WHEEL=str(unpacked), WHEEL_PROBE_DB=str(wheel_dir / 'probe.sqlite3'))
        # Execute outside the checkout, with explicit wheel import precedence over editable .pth.
        subprocess.run([sys.executable, '-c', program], cwd=wheel_dir, env=child_env, check=True)
        record = {'wheel_name': wheel.name, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
                  'migration_count': len(registry), 'webui_file_count': sum(path.is_file() for path in dist.rglob('*')),
                  'registry_members': 1, 'fresh_db_applied': 47, 'second_open_applied': 0}
        Path(os.environ['EVIDENCE_DIR'], 'wheel-verification.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record, sort_keys=True))
        PYCODE
    - name: Record final source identity and validation outcome
      if: ${{ always() }}
      env:
        CURRENT_JOB_STATUS: ${{ job.status }}
      run: |
        python - <<'PYCODE'
        import json
        import os
        import subprocess
        from pathlib import Path
        out = Path(os.environ['EVIDENCE_DIR'])
        record = {'slice': int(os.environ['SLICE']), 'sha': os.environ['EXPECTED_SHA'], 'job_status_before_evidence': os.environ['CURRENT_JOB_STATUS']}
        record['phase_exit_codes'] = {path.name.removesuffix('.exit-code.txt'): int(path.read_text().strip()) for path in sorted(out.glob('*.exit-code.txt'))}
        record['tracked_source_changes'] = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).splitlines()
        out.mkdir(parents=True, exist_ok=True)
        (out / 'result.json').write_text(json.dumps(record, indent=2) + '\n')
        print(json.dumps(record, sort_keys=True))
        assert not record['tracked_source_changes'], 'Validation changed tracked source; do not accept evidence'
        PYCODE
    - name: Preserve slice commands, actual exits, JUnit and synthetic diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: slice-${{ matrix.slice }}-${{ matrix.ref }}-attempt-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 14
  acceptance:
    name: Require all eight slices and identical dependency inputs
    needs:
    - plan
    - slice
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - name: Download slice evidence
      uses: actions/download-artifact@v4
      with:
        pattern: slice-*-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/slice-results
    - name: Check all slice results and exact dependency identity
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
        SLICES_RESULT: ${{ needs.slice.result }}
      run: |
        python - <<'PYCODE'
        import json
        import os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'slice-results'
        identities = [json.loads(path.read_text()) for path in root.glob('*/source-identity.json')]
        results = [json.loads(path.read_text()) for path in root.glob('*/result.json')]
        assert os.environ['PLAN_RESULT'] == 'success' and os.environ['SLICES_RESULT'] == 'success', 'A setup, preflight or slice check failed; preserve original failures'
        assert len(identities) == len(results) == 8
        assert {item['slice'] for item in identities} == {item['slice'] for item in results} == set(range(8))
        assert len({(item['uv_lock_sha256'], item['pyproject_sha256']) for item in identities}) == 1, 'All slices must use identical dependency inputs'
        for item in results:
            assert item['job_status_before_evidence'] == 'success'
            assert not item['tracked_source_changes']
            assert item['phase_exit_codes'].get('environment-preflight') == 0
            assert item['phase_exit_codes'].get('slice-python') == 0
            if item['slice'] in (0, 2, 6):
                assert item['phase_exit_codes'].get('regression-preflight') == 0
            assert all(code == 0 for code in item['phase_exit_codes'].values())
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
            summary.write('## Eight slice checks passed\n\n')
            summary.write('Every slice passed its fresh environment preflight and complete selected test files. Dependency lock and project inputs match across all eight. This is targeted intermediate-commit evidence, separate from final cross-platform full CI and actual-provider acceptance.\n\n')
            for item in sorted(identities, key=lambda row: row['slice']):
                summary.write(f"- Slice {item['slice']}: `{item['sha']}`\n")
        PYCODE
